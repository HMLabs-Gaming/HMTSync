name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # Build + Test on every push to main and on every pull request.
  # ---------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Enforce Version Consistency Before Merge
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          # --- Configuration ---
          PLUGIN_YML="src/main/resources/plugin.yml"
          PURPUR_YML="src/main/resources/purpur.yml"
          VELOCITY_JSON="src/main/resources/velocity-plugin.json"
          RELEASE_NOTES_FILE="release-notes.md"

          # 1. Get POM Version and Check for SNAPSHOT suffix
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "Current POM Version: $POM_VERSION"

          if [[ "$POM_VERSION" == *"-SNAPSHOT" ]]; then
            echo "::error file=pom.xml::The version in pom.xml is a SNAPSHOT version ($POM_VERSION). Please set the final stable version (e.g., remove -SNAPSHOT) before merging."
            exit 1
          fi

          # 1.1 Check if this version tag already exists
          if git rev-parse "v$POM_VERSION" >/dev/null 2>&1; then
            echo "::error file=pom.xml::Version v$POM_VERSION already exists. You must increment the version in pom.xml to a release that hasn't been used yet."
            exit 1
          fi

          # 2. Check YML files
          check_yml_version() {
            local file_path=$1
            local yml_version
            yml_version=$(grep "^version:" "$file_path" | awk '{print $2}' | tr -d '"[:space:]')
            if [[ "$yml_version" != "$POM_VERSION" ]]; then
              echo "::error file=$file_path::Version mismatch. POM: $POM_VERSION, $file_path: $yml_version. Must match POM version exactly."
              exit 1
            fi
            echo "✅ $file_path Check: Version matches POM."
          }

          # 2.1 Check the Velocity JSON descriptor
          check_json_version() {
            local file_path=$1
            local json_version
            json_version=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]*"' "$file_path" | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/')
            if [[ "$json_version" != "$POM_VERSION" ]]; then
              echo "::error file=$file_path::Version mismatch. POM: $POM_VERSION, $file_path: $json_version. Must match POM version exactly."
              exit 1
            fi
            echo "✅ $file_path Check: Version matches POM."
          }

          check_yml_version "$PLUGIN_YML"
          check_yml_version "$PURPUR_YML"
          check_json_version "$VELOCITY_JSON"

          # 3. Check that Release Notes mentions the new version
          if ! grep -Fq "$POM_VERSION" "$RELEASE_NOTES_FILE"; then
              echo "::error file=$RELEASE_NOTES_FILE::The release notes file does not contain the version number ($POM_VERSION). Please update it."
              exit 1
          fi
          echo "✅ $RELEASE_NOTES_FILE Check: Contains version $POM_VERSION."

          echo "All pre-release metadata checks passed."

      - name: Build backend JAR (Paper) and run tests
        run: |
          set -euo pipefail
          mkdir -p dist
          mvn -B verify -Pspigot
          cp target/hmt-sync-*-spigot.jar dist/

      - name: Build proxy JAR (Velocity)
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests -Pvelocity
          cp target/hmt-sync-*-velocity.jar dist/

      - name: Build universal JAR (Paper + Velocity)
        run: |
          set -euo pipefail
          mvn -B clean package -DskipTests -Puniversal
          cp target/hmt-sync-*-universal.jar dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hmt-sync-jars
          path: dist/*.jar
          if-no-files-found: error
