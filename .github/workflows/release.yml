# Caller workflow for HMTSync. Publishes external GitHub Release download links to Hangar.
name: HMTSync Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: hmt-sync
      java-version: "25"
      build-command: |
        set -Eeuo pipefail
        version="${GITHUB_REF_NAME#v}"
        mkdir -p release-build

        mvn -B clean package -DskipTests -Pspigot
        cp "target/hmt-sync-${version}-spigot.jar" "release-build/hmt-sync-${version}-spigot.jar"

        mvn -B clean package -DskipTests -Pvelocity
        cp "target/hmt-sync-${version}-velocity.jar" "release-build/hmt-sync-${version}-velocity.jar"

        mvn -B clean package -DskipTests -Puniversal
        cp "target/hmt-sync-${version}-universal.jar" "release-build/hmt-sync-${version}-universal.jar"

      artifacts-json: '[{"path":"release-build/hmt-sync-{version}-spigot.jar","loader":"spigot"},{"path":"release-build/hmt-sync-{version}-velocity.jar","loader":"velocity"},{"path":"release-build/hmt-sync-{version}-universal.jar","loader":"universal"}]'

      hangar-project-slug: HMTSync
      hangar-channel: Release
      # Do not upload the JAR to Hangar; link to the universal asset on GitHub Releases.
      # {tag} and {version} are expanded by the reusable workflow.
      hangar-files: '[{"platforms":["PAPER","VELOCITY"],"url":true,"externalUrl":"https://github.com/TitanSMP/HMTSync/releases/download/{tag}/hmt-sync-{version}-universal.jar"}]'
    secrets: inherit
